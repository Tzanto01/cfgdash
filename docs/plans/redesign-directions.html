<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cfgdash redesign directions (revision 1)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#d4d4d8;color:#18181b}
.x-bar{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding:10px 20px;background:#18181b;color:#fafafa}
.x-bar h1{margin:0;font-size:15px;font-weight:600}
.x-bar h1 span{margin-left:6px;font-weight:400;color:#a1a1aa}
.x-grp{display:flex;align-items:center;gap:8px}
.x-lbl{font-size:12px;color:#a1a1aa}
.x-seg{display:flex;gap:2px;padding:2px;background:#3f3f46;border-radius:6px}
.x-seg button{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:0;border-radius:4px;background:none;color:#f4f4f5;font:inherit;font-size:13px;cursor:pointer}
.x-seg button:hover{background:#52525b}
.x-seg [aria-selected=true],.x-seg [aria-pressed=true]{background:#fafafa;color:#18181b}
.x-seg button:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.x-seg em{padding:0 6px;border-radius:3px;background:#166534;color:#fff;font-style:normal;font-size:11px}
.x-note{flex-basis:100%;margin:0;font-size:12px;color:#d4d4d8}
#stage{overflow-x:auto;padding:24px 20px 60px}
#frame{margin:0 auto}
.w-desk{width:1280px}.w-mob{width:375px}
.x-thesis{max-width:900px;margin:0 0 24px;color:#27272a}
.x-fr{margin:0 0 40px}
.x-fr figcaption{margin:0 0 8px;font-size:13px;color:#3f3f46}
.x-fr figcaption b{color:#18181b}
.x-fr figcaption code{font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;font-size:12px}

.dir-a{--ui:"Geist","Geist Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;--dt:14%;--dbg:var(--surface)}
.dir-a[data-theme=light]{--bg:#f2f3f5;--surface:#fafafb;--raised:#ffffff;--hover:#e8eaee;--border:#d5d9de;--bs:#7f8791;--text:#14181d;--muted:#565f6b;--accent:#00677a;--afg:#ffffff;--focus:#0086a3;--ok:#166534;--warn:#7a4f00;--danger:#b42318;--co:#6d3fc0;--lm:#0a2540;--ll:#1b4a8a;--lp:#2f5f9f;--lu:#476e9f;--lfg:#ffffff;--tp:12%;--sh:0 8px 24px rgb(0 0 0/.12)}
.dir-a[data-theme=dark]{--bg:#0a0c0f;--surface:#101318;--raised:#171b21;--hover:#1d222a;--border:#262c34;--bs:#6b7580;--text:#e8eaed;--muted:#9ba4ae;--accent:#56d4e8;--afg:#06242b;--focus:#9fe6f3;--ok:#74d39a;--warn:#e3b55e;--danger:#f29a95;--co:#c3a8f2;--lm:#f0f4fa;--ll:#b4ceff;--lp:#8fb0ec;--lu:#6f8fc2;--lfg:#0a0c0f;--tp:14%;--sh:0 8px 24px rgb(0 0 0/.35)}
.dir-b{--ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;--serif:"Fraunces",Georgia,"Times New Roman",serif;--dt:12%;--dbg:var(--raised)}
.dir-b[data-theme=light]{--bg:#f6f1e7;--surface:#fffdf8;--raised:#ffffff;--hover:#ede6d7;--border:#ddd4c3;--bs:#857a66;--text:#1f1b16;--muted:#5c5448;--accent:#a13d1e;--afg:#ffffff;--focus:#2456c7;--ok:#166534;--warn:#7a4f00;--danger:#b42318;--co:#6d3fc0;--lm:#1f1b16;--ll:#0e5c6b;--lp:#1f5fa6;--lu:#5b5f6b;--lfg:#ffffff;--tp:12%;--sh:0 8px 24px rgb(0 0 0/.12)}
.dir-b[data-theme=dark]{--bg:#16130f;--surface:#1d1914;--raised:#26211a;--hover:#2e281f;--border:#3a3328;--bs:#7d7260;--text:#f0e9db;--muted:#b0a692;--accent:#f0a07a;--afg:#26140b;--focus:#8fb4ff;--ok:#74d39a;--warn:#e3b55e;--danger:#f29a95;--co:#c3a8f2;--lm:#f0e9db;--ll:#6fd0dc;--lp:#8db4f2;--lu:#a3a6b3;--lfg:#16130f;--tp:14%;--sh:0 8px 24px rgb(0 0 0/.35)}
.dir-c{--ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;--dt:14%;--dbg:var(--raised)}
.dir-c[data-theme=light]{--bg:#eef0f7;--surface:#f8f9fd;--raised:#ffffff;--hover:#e3e6f3;--border:#d3d7e8;--bs:#7a82a8;--text:#12152b;--muted:#4e5578;--accent:#3a49d6;--afg:#ffffff;--focus:#2a3bd0;--ok:#166534;--warn:#7a4f00;--danger:#b42318;--co:#a3207f;--lm:#2a3bd0;--ll:#0a6490;--lp:#7a4fd1;--lu:#5a6286;--lfg:#ffffff;--tp:12%;--sh:0 8px 24px rgb(0 0 0/.12)}
.dir-c[data-theme=dark]{--bg:#0c0e18;--surface:#131627;--raised:#1b1f36;--hover:#232844;--border:#2a3050;--bs:#6a7399;--text:#eceefa;--muted:#a3a9c9;--accent:#8b9cff;--afg:#0c0e18;--focus:#c0c9ff;--ok:#74d39a;--warn:#e3b55e;--danger:#f29a95;--co:#f0a0dc;--lm:#aab6ff;--ll:#62c3ee;--lp:#c2a2ff;--lu:#9aa2c4;--lfg:#0c0e18;--tp:14%;--sh:0 8px 24px rgb(0 0 0/.35)}

.scr{position:relative;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--ui);border:1px solid #71717a}
:where(.scr) button,:where(.scr) input{margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:inherit;cursor:pointer}
:where(.scr) input{cursor:text}
:where(.scr) input::placeholder{color:var(--muted);opacity:1}
:where(.scr) code{font-family:var(--mono);font-size:inherit}
:where(.scr) h1,:where(.scr) h2,:where(.scr) p{margin:0}
:where(.scr) kbd{padding:0 4px;border:1px solid var(--border);border-radius:3px;background:var(--surface);color:var(--muted);font:11px/16px var(--mono)}
.scr :focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dir-c .ic{stroke-width:1.75}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{position:relative;display:flex;flex-direction:column;min-height:600px}
.m .app{min-height:740px}
.bd{display:flex;flex:1;min-height:0}
.col{display:flex;flex:1;flex-direction:column;min-width:0}
.mn{flex:1;min-width:0}
.sp{flex:1}
.hd{display:flex;flex:none;align-items:center;gap:8px}
.ni{display:flex;align-items:center;gap:10px;width:100%;white-space:nowrap}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:4px;color:var(--muted)}
.ib.sm{width:24px;height:24px}
.ib:hover,.ni:hover,.fs:hover,.crumb:hover,.kb:hover{background:var(--hover)}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--bs);background:var(--raised);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.pri{border-color:var(--accent);background:var(--accent);color:var(--afg);font-weight:600}
.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,var(--text))}
.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.kb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.kb kbd{margin-left:auto}
.flt:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.flt input,.pin input{flex:1;min-width:0;color:var(--text);outline:none}
.bdg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) var(--tp),var(--surface))}
.bdg.t-n{border-color:var(--bs);background:var(--surface);color:var(--muted)}
.t-danger{--c:var(--danger)}.t-warn{--c:var(--warn)}.t-ok{--c:var(--ok)}.t-co{--c:var(--co)}.t-n{--c:var(--muted)}
.fl{display:flex;flex-wrap:wrap;gap:4px}
.plus{color:var(--ok)}.minus{color:var(--danger)}
.dbody{overflow-x:auto;background:var(--dbg)}
.dl{display:flex;width:max-content;min-width:100%;--rb:var(--dbg);background:var(--rb)}
.dl.add{--rb:color-mix(in srgb,var(--ok) var(--dt),var(--dbg))}
.dl.del{--rb:color-mix(in srgb,var(--danger) var(--dt),var(--dbg))}
.dl .g{position:sticky;left:0;flex:none;width:40px;padding-right:8px;background:var(--rb);color:var(--muted);font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.dl .g+.g{left:40px}
.dl .sg{flex:none;width:16px;font-family:var(--mono);text-align:center}
.dl.add .sg{color:var(--ok)}.dl.del .sg{color:var(--danger)}
.dl code{padding-right:16px;white-space:pre}
.dh{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px}
.dh code{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ban{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) var(--tp),var(--surface));color:var(--text)}
.ban>.ic{margin-top:2px;color:var(--danger)}
.ban>div{flex:1}
.m .ban{flex-wrap:wrap}
.abar{position:sticky;bottom:0;display:flex;flex:none;align-items:center;gap:8px;margin-top:auto}
.scrim{position:absolute;inset:0;z-index:5;background:rgb(0 0 0/.45)}
.pal{position:absolute;z-index:6;left:50%;display:flex;flex-direction:column;overflow:hidden;transform:translateX(-50%);background:var(--raised);border:1px solid var(--border);box-shadow:var(--sh)}
.m .pal{top:8px!important;width:calc(100% - 16px)!important;transform:translateX(-50%)!important}
.pin{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);color:var(--muted)}
.pin:focus-within{box-shadow:inset 0 -2px var(--focus)}
.pbody{display:flex;min-height:0}
.plist{flex:1;min-width:0;padding:4px 0}
.pgh{color:var(--muted)}
.pi{display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer}
.pi:hover,.pi[aria-selected=true]{background:var(--hover)}
.pi kbd{margin-left:auto}
.pt{flex:1;min-width:0}
.pi u{text-underline-offset:2px}
.pd{color:var(--muted)}
.pf{padding:8px 14px;border-top:1px solid var(--border);color:var(--muted);font:11px/16px var(--mono)}
.dir-a.m .cr,.dir-c.m .cr{grid-template-columns:20px minmax(0,1fr) auto;grid-template-areas:"no pa est" ". fl bar";height:auto;min-height:44px;padding:8px 16px;row-gap:4px}
.dir-a.m .cr>.no,.dir-c.m .cr>.no{grid-area:no}
.dir-a.m .cr>.pa,.dir-c.m .cr>.pa{grid-area:pa;white-space:normal;overflow-wrap:anywhere}
.dir-a.m .cr>.est,.dir-c.m .cr>.est{grid-area:est}
.dir-a.m .cr>.fl,.dir-c.m .cr>.fl{grid-area:fl}
.dir-a.m .cr>.bar,.dir-c.m .cr>.bar{grid-area:bar;align-self:center}
.m .cr.th{display:none}

.dir-a .scr{font-size:13px;line-height:18px;font-weight:500}
.dir-a .scr :is(button,.flt){transition:background-color .1s linear,color .1s linear,border-color .1s linear}
.dir-a .hd{height:40px;padding:0 8px 0 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.dir-a .mach{display:flex;align-items:center;gap:6px;padding-right:10px;border-right:1px solid var(--border);font:600 12.5px/18px var(--mono)}
.dir-a .fs{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:3px;font:12.5px/18px var(--mono)}
.dir-a .kb{height:28px;min-width:220px;padding:0 4px 0 8px;border-radius:3px}
.dir-a .ib,.dir-a .btn{border-radius:3px}
.dir-a .sb{display:flex;flex:none;flex-direction:column;width:208px;padding:6px 0;background:var(--surface);border-right:1px solid var(--border)}
.dir-a .gl{padding:14px 12px 4px;color:var(--muted);font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dir-a .ni{position:relative;height:28px;padding:0 12px}
.dir-a .ni .ic{color:var(--muted)}
.dir-a .ni.on{background:var(--hover)}
.dir-a .ni.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.dir-a .nc{margin-left:auto;color:var(--muted);font:12px var(--mono)}
.dir-a .clp{margin-top:auto;color:var(--muted)}
.dir-a .ph{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-bottom:1px solid var(--border)}
.dir-a h1{font-size:20px;line-height:28px;font-weight:600}
.dir-a .cnt{color:var(--muted);font:12.5px var(--mono)}
.dir-a .tool{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-bottom:1px solid var(--border)}
.dir-a .flt{display:flex;align-items:center;gap:6px;width:260px;height:28px;margin-right:6px;padding:0 8px;border:1px solid var(--bs);border-radius:3px;background:var(--raised);color:var(--muted)}
.dir-a .flt input,.dir-a .pin input{font:12.5px var(--mono)}
.dir-a .chip{height:24px;padding:0 8px;border:1px solid var(--border);border-radius:3px;color:var(--muted)}
.dir-a .chip:hover{background:var(--hover)}
.dir-a .chip[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) var(--tp),var(--surface));color:var(--accent)}
.dir-a .sec,.dir-a .sec0,.dir-a .th{color:var(--muted);font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dir-a .th{font-size:11px}
.dir-a .sec{padding:14px 16px 6px;border-bottom:1px solid var(--border)}
.dir-a .row{display:grid;grid-template-columns:300px minmax(0,1fr) 84px 240px;align-items:center;gap:12px;width:100%;height:28px;padding:0 16px;border-bottom:1px solid var(--border)}
.dir-a .row:hover{background:var(--hover)}
.dir-a .row.sel,.dir-a .hrow.sel{background:var(--hover);box-shadow:inset 2px 0 var(--accent)}
.dir-a .k,.dir-a .v{overflow:hidden;font-size:12.5px;text-overflow:ellipsis;white-space:nowrap}
.dir-a .bdg{height:20px;padding:0 6px;border-radius:2px;font:11px/18px var(--mono)}
.dir-a .lin{display:inline-flex;gap:2px}
.dir-a .lin i,.dir-a .lg{display:grid;place-items:center;width:18px;height:18px;border:1px solid var(--l);border-radius:2px;color:var(--l);font:600 11px/1 var(--mono);font-style:normal}
.dir-a .lin .s-w,.dir-a .el.s-w .lg{background:var(--l);color:var(--lfg);font-weight:800}
.dir-a .lin .s-o,.dir-a .el.s-o .lg{text-decoration:line-through}
.dir-a .lin .s-n{border-style:dotted;border-color:var(--bs);color:var(--muted)}
.dir-a .lin .s-m,.dir-a .el.s-m .lg{background:linear-gradient(135deg,var(--l) 50%,transparent 50%);color:var(--text)}
.dir-a .exp{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:16px;padding:3px 16px 3px 30px;background:var(--raised);border-bottom:1px solid var(--border)}
.dir-a .el{grid-column:1;display:grid;grid-template-columns:16px 140px 160px auto;align-items:center;gap:10px;height:21px;font:12.5px/18px var(--mono)}
.dir-a .el .lg{width:16px;height:16px;font-size:10px}
.dir-a .el.s-o .ev{color:var(--muted);text-decoration:line-through}
.dir-a .ew{color:var(--muted)}
.dir-a .el.s-w .ew{color:var(--ok)}
.dir-a .exp .btn{grid-column:2;grid-row:1/span 2}
.dir-a .tot{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.dir-a .tbar{display:flex;flex:1;gap:1px;height:6px}
.dir-a .tbar i{background:var(--muted)}
.dir-a .tbar i:nth-child(even){opacity:.6}
.dir-a .cr{display:grid;grid-template-columns:28px minmax(0,1fr) 220px 96px 80px;align-items:center;gap:12px;height:28px;padding:0 16px;border-bottom:1px solid var(--border)}
.dir-a .no{color:var(--muted);font:12px var(--mono);text-align:right}
.dir-a .pa{overflow:hidden;padding-left:calc(var(--d)*16px);font-size:12.5px;text-overflow:ellipsis;white-space:nowrap}
.dir-a .tr{color:var(--muted)}
.dir-a .bar{width:96px;height:6px;background:var(--hover)}
.dir-a .bar i{display:block;height:100%;background:var(--muted)}
.dir-a .est{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.dir-a .cr.err .pa,.dir-a .cr.err .est{color:var(--danger)}
.dir-a .cr.err .bar{background:none;outline:1px solid var(--danger)}
.dir-a .cr.ref .bar i{opacity:.4}
.dir-a .cr.ref .est{color:var(--muted)}
.dir-a .idn{display:flex;flex-wrap:wrap;gap:4px 24px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);font:12.5px/18px var(--mono)}
.dir-a .idn span:first-child{font-weight:700}
.dir-a .ov{display:grid;grid-template-columns:minmax(0,1fr) 360px}
.dir-a .ov>div+div{border-left:1px solid var(--border)}
.dir-a .crow{display:grid;grid-template-columns:72px minmax(0,1fr) 16px;align-items:center;gap:16px;width:100%;padding:4px 16px;border-bottom:1px solid var(--border)}
.dir-a .crow:hover{background:var(--hover)}
.dir-a .crow .ic{color:var(--muted)}
.dir-a .big{font:500 28px/32px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.dir-a .vt{display:flex;align-items:baseline;gap:16px}
.dir-a .vt b{flex:none;width:150px;font-weight:600}
.dir-a .vd{color:var(--muted)}
.dir-a .ua{display:flex;justify-content:space-between;gap:12px;padding:5px 16px;border-bottom:1px solid var(--border)}
.dir-a .ua code{font-size:12.5px}
.dir-a .ua span{color:var(--muted)}
.dir-a .hint{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.dir-a .hrow{display:grid;grid-template-columns:104px 130px 230px minmax(0,1fr) 64px;align-items:center;gap:12px;min-height:28px;padding:2px 16px;border-bottom:1px solid var(--border)}
.dir-a .hrow:not(.th):hover{background:var(--hover)}
.dir-a .sev{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-weight:600}
.dir-a .rl,.dir-a .tg code{font-size:12.5px}
.dir-a .tg{display:flex;align-items:center;gap:2px}
.dir-a .dfile{margin:16px;border:1px solid var(--border)}
.dir-a .dh{height:32px;padding:0 10px;background:var(--raised);border-bottom:1px solid var(--border);font:12.5px/18px var(--mono)}
.dir-a .ban{border-width:0 0 1px}
.dir-a .dl{font-size:12.5px;line-height:20px}
.dir-a .abar{height:56px;padding:0 16px;background:var(--surface);border-top:1px solid var(--border);font:12.5px var(--mono)}
.dir-a .pal{top:12%;width:560px;border-radius:3px}
.dir-a .pin{height:44px}
.dir-a .pgh{padding:8px 12px 4px;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dir-a .pi{height:30px;padding:0 12px}
.dir-a .pi[aria-selected=true]{box-shadow:inset 2px 0 var(--accent)}
.dir-a .pt{display:flex;align-items:baseline;gap:10px;overflow:hidden;white-space:nowrap}
.dir-a .pl{font:12.5px var(--mono)}
.dir-a .pd{overflow:hidden;font-size:12px;text-overflow:ellipsis}
.dir-a.m .hd{height:44px;padding:0}
.dir-a.m .ttl{flex:1;font-size:15px;font-weight:600}
.dir-a.m .ib{width:44px;height:44px}
.dir-a.m .ph{flex-wrap:wrap;gap:4px 12px;padding:10px 16px}
.dir-a.m .tool{flex-wrap:wrap;padding:8px 16px}
.dir-a.m .flt{width:100%;height:44px;margin:0 0 4px}
.dir-a.m .chip{height:32px}

const dfA=e=>phA('Edit settings','dry run')+`<div class="dfile"><div class="dh">${ic('file-text',14)}<code>~/.claude/settings.json</code><span class="bdg t-n">user</span><span class="sp"></span>${pm(2,1)}</div>${e?ban():''}<div class="dbody">${drows()}</div></div>`;
const barA=e=>`<div class="abar"><code>2 files, <span class="plus">+3</span> <span class="minus">-1</span>, ${e?'dry run out of date':'dry run'}</code><span class="sp"></span><button class="btn">Cancel</button><button class="btn pri"${e?' aria-disabled="true"':''}>Apply</button></div>`;

const shB=(v,b,o={})=>`<div class="app">${M
 ?`<header class="hd"><span class="wm">cfgdash</span><span class="sp"></span><button class="ib" aria-label="Open command palette">${ic('search')}</button><button class="ib" aria-label="Open navigation">${ic('menu')}</button></header>${col(b,o)}`
 :`<div class="bd"><nav class="sb" aria-label="Views"><div class="wm">cfgdash</div>${navH(v)}</nav><div class="col"><header class="hd"><button class="crumb">${ic('folder',14)}<span>devbox</span><i>/</i>home<i>/</i>user<i>/</i>ws<i>/</i><b>app</b>${ic('chev-d',14)}</button><span class="sp"></span>${kbBtn()}${thBtn()}</header><main class="mn">${b}</main>${o.bar||''}</div></div>`}${o.over||''}</div>`;
const phB=(t,s)=>`<div class="ph"><h1>${t}</h1><p>${s}</p></div>`;

const setB=()=>{let g='';const rows=S.map((s,i)=>{const h=s.g!==g?`<div class="sec">${g=s.g}</div>`:'';return h+`<button class="srow${i?'':' sel'}" ${M?'aria-expanded':'aria-pressed'}="${!i}"><code class="k">${s.k}</code><code class="v">${esc(s.v)}</code>${chipB(s)}<span class="fl">${bdgs(s.f)}</span></button>`+(!i&&M?`<div class="acc">${specIn(s)}<div class="acts"><button class="btn">${ic('ext',14)}Open file</button></div></div>`:'')}).join('');return phB('Settings','Effective settings and where each value comes from.')+(M?rows:`<div class="md"><div>${rows}</div><aside class="spec" aria-label="Specimen for model"><div class="pn">Specimen</div>${specIn(S[0])}<div class="acts"><button class="btn">${ic('ext',14)}Open file</button><button class="btn">${ic('copy',14)}Copy path</button></div></aside></div>`)};
const insB=()=>phB('Instructions','The files Claude reads for this folder, in load order.')+`<div class="toc">${IN.map((r,i)=>`<div class="tr${r.d?' ch':''}${r.err?' err':''}"><div class="tl"><span class="tn">${i+1}</span>${r.d?'<span class="br">└</span>':''}<code class="tp">${esc(r.p).replace(/\//g,'/<wbr>')}</code><span class="ld"></span><span class="tt">${estOf(r)}</span></div>${r.f.length?`<div class="tfl">${bdgs(r.f)}</div>`:''}${r.t?`<div class="tb4"><i style="width:${r.t/2250*100}%"></i></div>`:''}</div>`).join('')}<p class="tf">4 files, 4,600 tokens est.</p></div>`;
const ovB=()=>phB('Overview','One machine, as it is configured right now.')+`<p class="prose">devbox is a Windows x64 machine. 4 of 6 collectors are active. <button class="lnk">3 findings</button> need attention.</p><p class="meta">Tailnet <code>devbox.example.ts.net</code> · collected 10:00Z · v0.1.0</p><h2>Index</h2><div class="idx">${VW.map(([n,,c,d])=>`<button class="ix"><span class="in">${n}</span><span class="id">${d}</span><span class="ic2">${c??'–'}</span></button>`).join('')}</div><h2>Not available here</h2><ul class="na">${UA.map(([c,r])=>`<li><code>${c}</code>: ${r}</li>`).join('')}</ul>`;
const hB=()=>phB('Health','Things worth checking on this machine.')+[['Needs attention',0],['Worth a look',1],['For information',2]].map(([t,i])=>{const h=H[i];return `<h2>${t} (1)</h2><article class="hcard t-${h.sev}"><div class="hh">${ic(h.i)}<b>${h.w}</b><code>${h.r}</code></div><p>${h.m}</p><div class="ht"><code>${h.t}</code><button class="btn sm">${ic('ext',14)}Open</button></div></article>`}).join('');
const dfB=e=>phB('Review changes','Nothing is written until you apply.')+`<section class="prop"><h2 class="pt2">Proposal 1 of 2</h2><p class="meta"><span class="bdg t-n">User scope</span><code>~/.claude/settings.json</code></p>${e?ban():''}<div class="dcard"><div class="dh"><code>~/.claude/settings.json</code><span class="sp"></span>${pm(2,1)}</div><div class="dbody">${drows()}</div></div></section>`;
const barB=e=>`<div class="abar"><p>${e?'The dry run is out of date. Run it again to apply.':'Apply 3 changes to user settings. A dry run showed no conflicts.'}</p><button class="btn">Cancel</button><button class="btn pri"${e?' aria-disabled="true"':''}>Apply</button></div>`;

const TABS=[['Overview','home'],['Health','activity'],['Settings','sliders'],['Search','search'],['More','more']];
const shC=(v,b,o={})=>{const tv=TABS.some(t=>t[0]===v)?v:'More';return `<div class="app">${M
 ?`<header class="hd"><span class="wm">${ic('home')}cfgdash</span><span class="sp"></span>${thBtn()}</header>${col(b,o)}<nav class="tabs" aria-label="Views">${TABS.map(([n,i])=>`<button${n===tv?' class="on" aria-current="page"':''}>${ic(i,20)}<span>${n}</span></button>`).join('')}</nav>`
 :`<div class="bd"><nav class="sb" aria-label="Views">${navH(v)}<button class="ni pinb" title="Pin sidebar">${ic('panel')}<span class="nl">Pin sidebar</span></button></nav><div class="col"><header class="hd">${fsBtn()}<span class="mach">${ic('monitor',14)}devbox</span><span class="sp"></span>${kbBtn()}${thBtn()}<button class="btn">${ic('pencil',14)}Edit</button></header><main class="mn">${b}</main>${o.bar||''}</div></div>`}${o.over||''}</div>`};
const vhC=(t,x='')=>`<div class="vhd"><h1>${t}</h1>${x}</div>`;
const svb=c=>`<span class="svb${c}" role="img" aria-label="1 danger, 1 warning, 1 info">${H.map(h=>`<i class="t-${h.sev}"></i>`).join('')}</span><span class="svt">${H.map(h=>`<span class="t-${h.sev}">${ic(h.i,14)}1 ${h.w.toLowerCase()}</span>`).join('')}</span>`;
const setC=()=>vhC('Settings',`<span class="cnt">42 keys</span><span class="sp"></span><label class="flt">${ic('search',14)}<input placeholder="Filter keys" aria-label="Filter keys"></label>`)+`<div class="card"><div class="ch">Effective settings</div><div class="kgrid">${S.map((s,i)=>`<button class="kc${i?'':' sel'}" aria-expanded="${!i}"><span class="kt"><span class="k">${s.k}</span><span class="fl">${bdgs(s.f)}</span></span><code class="v">${esc(s.v)}</code>${linC(s)}${i?'':`<span class="kd">${layersOf(s).map(([k,t,v])=>`<span class="kl s-${t}"><i style="--l:var(${LV[k]})">${k}</i>${LN[k]}<code>${esc(v)}</code><span class="ew">${SW[t]}</span></span>`).join('')}</span>`}</button>`).join('')}</div></div>`;
const insC=()=>vhC('Instructions')+`<div class="card"><div class="ihead"><div><div class="tl">Loaded for /home/user/ws/app</div><div class="num">4,600 <small>tok est.</small></div></div><span class="sbar" role="img" aria-label="Share of 4,600 estimated tokens by file">${LOADED.map(r=>`<i style="flex:${r.t}" title="${esc(r.p)}: ${fmt(r.t)}"></i>`).join('')}</span></div>${IN.map((r,i)=>`<div class="cr${r.err?' err':''}${r.x?' ref':''}"><span class="no">${i+1}</span><code class="pa" style="--d:${r.d}">${r.d?'└ ':''}${esc(r.p)}</code><span class="fl">${bdgs(r.f)}</span><span class="bar"><i style="width:${r.t/TOT*100}%"></i></span><code class="est">${estOf(r,' tok')}</code></div>`).join('')}</div>`;
const TILE=['Settings','Instructions','Agents','Skills & commands','Hooks','MCP & permissions','Sessions','Memory'];
const ovC=()=>vhC('Overview',`<span class="cnt">devbox · collected 10:00Z</span>`)+`<div class="bento"><button class="tile w2 h2 on"><span class="tl">${ic('activity',20)}Health</span><span class="num">3 <small>findings</small></span>${svb('')}<span class="top">${H.slice(0,2).map(h=>`<span class="tf t-${h.sev}">${ic(h.i,14)}<code>${h.r}</code><span>${h.t}</span></span>`).join('')}</span></button><div class="tile w2"><span class="tl">${ic('monitor',20)}Identity</span><span class="idt"><b>devbox</b><span>windows x64</span><code>devbox.example.ts.net</code><span>v0.1.0</span></span></div>${VW.filter(x=>TILE.includes(x[0])).map(([n,i,c])=>`<button class="tile"><span class="tl">${ic(i,20)}${n}</span><span class="num">${c}</span>${n==='Memory'?'<span class="chg">changed</span>':''}</button>`).join('')}<div class="tile w2"><span class="tl">${ic('info',20)}Collectors</span><span class="num">4 <small>of 6 active</small></span>${UA.map(([c,r])=>`<span class="ua"><code>${c}</code><span>${r}</span></span>`).join('')}</div></div>`;
const hC=()=>vhC('Health',`<span class="cnt">3 findings</span>`)+`<div class="hsum">${svb(' lg')}</div><div class="hsplit"><div class="card hl" role="listbox" aria-label="Findings">${H.map((h,i)=>`<div class="hi t-${h.sev}" role="option" aria-selected="${!i}">${ic(h.i)}<span><b>${h.w}</b><code>${h.t}</code></span></div>`).join('')}</div><div class="card hdet"><span class="sev t-danger">${ic('octagon')}Danger</span><h2>Hook script is missing</h2><p>${H[0].m}</p><dl><dt>Target</dt><dd><code>hooks/guard.sh</code></dd><dt>Rule</dt><dd><code>missing-script</code></dd></dl><button class="btn pri">${ic('ext',14)}Open file</button></div></div>`;
const dfC=e=>vhC('Review changes',`<span class="cnt">2 files</span>`)+`<div class="dcard${e?' bad':''}"><div class="dh">${ic('file-text')}<code>~/.claude/settings.json</code><span class="bdg t-n">User</span><span class="bdg t-n">Dry run</span><span class="sp"></span>${pm(2,1)}</div>${e?ban():''}<button class="hk" aria-expanded="true">${ic('chev-d',14)}<code>@@ -1,6 +1,7 @@</code></button><div class="dbody">${drows()}</div></div>`;
const barC=e=>`<div class="abar"><div><b>3 changes</b><span>2 files, dry run ${e?'out of date':'passed'}</span></div><span class="sp"></span><button class="btn">Cancel</button><button class="btn pri lg"${e?' aria-disabled="true"':''}>Apply</button></div>`;
const pvC=()=>`<div class="pv"><span class="tl">Preview</span><code class="k">model</code><code class="v">opus</code>${linC(S[0])}<p>Applied from project (local); the user value sonnet is overridden.</p><button class="btn sm">${ic('ext',14)}Open in Settings</button></div>`;

const DIRS={
a:{sh:shA,set:setA,ins:insA,ov:ovA,h:hA,df:dfA,bar:barA,pal:()=>pal(),
 thesis:'A. Instrument panel (recommended). The interface reads like a precise instrument; everything is a labelled row of mono values with a four-cell lineage strip, and color appears only where state lives.',
 mob:'375 px: 44px top bar with a hamburger nav sheet (folder switcher inside), rows stack key / value / lineage plus flags, tap expands, the file sheet goes full height, the diff scrolls horizontally with sticky gutters, the Apply bar keeps a safe-area inset.',
 cap:{set:'Header 40px, sidebar 208px (collapses to a 48px icon rail), page head 56px, toolbar 40px, rows 28px. Row <code>model</code> is expanded inline; "Open file" opens a 480px side sheet (not shown). Hover, focus and selection: 100ms linear.',
  ins:'Tree table under a full-width total bar; 96x6 token bars in muted; the error node is outlined in danger. The total counts the four loaded files; the referenced file is listed but not counted.',
  ov:'No cards: mono identity strip, counts table with one linked row per view, Unavailable list, Health count chip.',
  h:'Table sorted by severity with filter chips; j / k move, Enter opens.',
  df:'Unified diff with two 40px gutters, sticky 32px file header, pinned 56px Apply bar. After apply the changed row tint-flashes 400ms (reduced motion: a static 6px "changed" dot).',
  dfe:'Stale dry run: danger banner between header and diff, staged changes kept, Apply disabled.',
  pal:'Ctrl/Cmd+K, 560px at 12vh, mono input, matches underlined. Opens with 100ms opacity plus 4px.'}},
b:{sh:shB,set:setB,ins:insB,ov:ovB,h:hB,df:dfB,bar:barB,pal:()=>pal(),
 thesis:'B. Field guide. A printed reference for one machine; a warm paper theme and a lamp-lit dark theme, serif headings, and lineage drawn as numbered strata so "why this value" reads like a footnote. Route content fades and rises 8px over 220ms once per route; strata stagger 40ms (max 160ms).',
 mob:'375 px: 48px top bar (wordmark, palette, drawer), single column, the specimen becomes an inline accordion, leaders kept, paths wrap at /, pinned Apply bar.',
 cap:{set:'Sidebar 232px with serif wordmark, header 48px with a breadcrumb folder button. Master-detail: sticky 400px specimen at 1100px and wider (a bottom drawer at 768 to 1099px). Rows show a compact layer chip.',
  ins:'Contents page: dotted leaders to token counts, a 4px bar scaled to the largest file, children indented with └.',
  ov:'Prose block above a typographic index of views; "Not available here" with reasons.',
  h:'Grouped by urgency; cards show rule, target and message.',
  df:'"Proposal 1 of 2" heading over scope and path, diff in a raised card, sticky Apply bar with the dry-run sentence.',
  dfe:'Stale dry run: danger banner above the diff card, staged changes kept, Apply disabled.',
  pal:'Centered 640px on raised, serif group headings, 15px items with muted descriptions; results show path and snippet.'}},
c:{sh:shC,set:setC,ins:insC,ov:ovC,h:hC,df:dfC,bar:barC,pal:()=>pal(M?'':pvC()),
 thesis:'C. Control room. A status board; a tile grid shows the machine\'s live state with counts that tick, an indigo accent and a route-style lineage make changes visible, and the views behind it stay dense.',
 mob:'375 px: 48px top bar, 56px bottom tab bar (Overview, Health, Settings, Search, More), bento in one column with count tiles 2-up, the route sits under the key, the Apply bar sits above the tab bar.',
 cap:{set:'64px icon rail (expands to 232px on hover or focus-within, pinnable), header 52px. Each key is a card with its route; the selected card expands with the contributing layers.',
  ins:'Tree in a card with 120x8 token bars in accent at 70%; the header shows the total and one segment per loaded file.',
  ov:'Bento: Health 2x2, Identity 2x1, count tiles, Collectors 2x1. Memory shows the reduced-motion "changed" dot; with motion, counts tick 600ms after a refresh and the tile border pulses once.',
  h:'Segmented severity bar, 320px findings list and a detail pane (a sheet when narrow).',
  df:'Raised card per file with a collapsible hunk; pinned 64px footer card with a large Apply. Sheet, palette and list reorder use a spring (stiffness 400, damping 34).',
  dfe:'Stale dry run: danger banner on the affected card, staged changes kept, Apply disabled.',
  pal:'640px with results and preview panes above 768px, single pane below.'}}
};
const FR=[['set','1','Shell + Settings','Settings'],['ins','2','Instructions','Instructions'],['ov','3','Overview','Overview'],['h','4','Health','Health'],['df','5','Settings edit: diff review','Settings'],['dfe','5b','Settings edit: stale-error variant','Settings'],['pal','6','Command palette over the shell','Settings']];
function frameHTML(d,k,v){const e=k==='dfe';if(k==='df'||e)return d.sh(v,d.df(e),{bar:d.bar(e)});if(k==='pal')return d.sh(v,d.set(),{over:d.pal()});return d.sh(v,d[k]())}
const root=document.getElementById('root'),frameEl=document.getElementById('frame');
function render(){const d=DIRS[cur];root.className='dir dir-'+cur+(M?' m':'');root.dataset.theme=T;root.setAttribute('aria-labelledby','tab-'+cur);root.innerHTML=`<p class="x-thesis">${d.thesis}${M?' '+d.mob:''}</p>`+FR.map(([k,n,t,v])=>`<figure class="x-fr"><figcaption><b>${n}. ${t}.</b> ${d.cap[k]}</figcaption><div class="scr">${frameHTML(d,k,v)}</div></figure>`).join('')}
function press(b){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}
const tabs=[...document.querySelectorAll('[role=tab]')];
function sel(t){tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',String(on));x.tabIndex=on?0:-1});cur=t.dataset.dir;render()}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>sel(t));t.addEventListener('keydown',e=>{const n=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;const x=e.key==='Home'?tabs[0]:e.key==='End'?tabs[tabs.length-1]:n?tabs[(i+n+tabs.length)%tabs.length]:null;if(x){e.preventDefault();x.focus();sel(x)}})});
document.querySelectorAll('[data-theme-set]').forEach(b=>{if(b.dataset.themeSet===T)press(b);b.addEventListener('click',()=>{T=b.dataset.themeSet;press(b);render()})});
document.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{M=b.dataset.w==='m';press(b);frameEl.className=M?'w-mob':'w-desk';render()}));
render();
</script>
